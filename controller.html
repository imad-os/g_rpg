<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hollowmere controller</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080c; color: #fff; font-family: 'Segoe UI', Tahoma, 'Noto Sans', 'Noto Sans Arabic', Arial, sans-serif; overflow: hidden;
               touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  #info { position: fixed; inset: 0; overflow: auto; padding: 5vmin; box-sizing: border-box; font-size: max(16px, 3.2vmin); line-height: 1.45; touch-action: pan-y; }
  h1 { font-size: max(22px, 5vmin); color: #ffd76a; margin: 0 0 2vmin; }
  #code { width: 100%; box-sizing: border-box; margin: 3vmin 0; padding: 2vmin; border-radius: 1.5vmin; border: 3px solid rgba(255,255,255,0.4); background: #10131c; color: #ffd76a;
          font: 800 max(32px, 9vmin) monospace; letter-spacing: 0.3em; text-align: center; text-transform: uppercase; -webkit-user-select: text; user-select: text; }
  .b { display: inline-block; padding: 2vmin 5vmin; border-radius: 1.5vmin; border: 2px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.14); font-weight: 700; font-size: max(18px, 3.6vmin); cursor: pointer; touch-action: manipulation; }
  #msg { margin: 2vmin 0; color: #9af0b0; } #msg.bad { color: #ff9a9a; }
  #live { position: fixed; top: 2vmin; left: 0; right: 0; text-align: center; font-size: max(14px, 3vmin); color: #9af0b0; pointer-events: none; display: none; }
</style>
</head>
<body>
<div id="info">
  <h1 id="h"></h1>
  <div id="how"></div>
  <input id="code" maxlength="5" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" inputmode="text" placeholder="•••••">
  <span class="b" id="go"></span>
  <div id="msg"></div>
</div>
<div id="live"></div>
<script src="js/firebase-config.js?v=2.4.0"></script>
<script src="js/netpad.js?v=2.4.0"></script>
<script src="js/netpad-room.js?v=2.4.0"></script>
<script src="js/virtual-pad.js?v=2.4.0"></script>
<script>
(function () {
    'use strict';
    var TXT = {
        en: { h: 'Hollowmere controller', how: 'Type the 5-letter code shown on the game screen (Co-op menu). Both devices must be on the same Wi-Fi.', go: 'Join', wait: 'Connecting...', live: 'Connected: press A to join the game', none: 'No game found with that code. Check it and try again.', net: 'Could not reach the internet.', rules: 'The room service is not set up yet.', config: 'Firebase settings are missing in this app.', fail: 'Could not connect. Both devices must be on the same Wi-Fi (not a guest network).', lost: 'Disconnected. Ask the game for a new code.', again: 'Start again', nonet: 'This browser cannot connect. Try Chrome or Safari.' },
        fr: { h: 'Manette Hollowmere', how: 'Tapez le code à 5 lettres affiché sur l\'écran du jeu (menu Coop). Les deux appareils doivent être sur le même Wi-Fi.', go: 'Rejoindre', wait: 'Connexion...', live: 'Connecté : appuyez sur A pour rejoindre la partie', none: 'Aucun jeu avec ce code. Vérifiez et réessayez.', net: 'Impossible de joindre internet.', rules: 'Le service de salles n\'est pas encore configuré.', config: 'Les réglages Firebase manquent dans cette appli.', fail: 'Connexion impossible. Les deux appareils doivent être sur le même Wi-Fi (pas un réseau invité).', lost: 'Déconnecté. Demandez un nouveau code au jeu.', again: 'Recommencer', nonet: 'Ce navigateur ne peut pas se connecter. Essayez Chrome ou Safari.' },
        es: { h: 'Mando de Hollowmere', how: 'Escribe el código de 5 letras que aparece en la pantalla del juego (menú Coop). Los dos dispositivos deben estar en la misma Wi-Fi.', go: 'Unirse', wait: 'Conectando...', live: 'Conectado: pulsa A para unirte a la partida', none: 'No hay ningún juego con ese código. Revísalo e inténtalo de nuevo.', net: 'No se pudo llegar a internet.', rules: 'El servicio de salas aún no está configurado.', config: 'Faltan los ajustes de Firebase en esta app.', fail: 'No se pudo conectar. Los dos dispositivos deben estar en la misma Wi-Fi (no una red de invitados).', lost: 'Desconectado. Pide un código nuevo al juego.', again: 'Empezar de nuevo', nonet: 'Este navegador no puede conectarse. Prueba Chrome o Safari.' },
        ar: { h: 'يد تحكم هولومير', how: 'اكتب الرمز المكوّن من 5 أحرف الظاهر على شاشة اللعبة (قائمة التعاون). يجب أن يكون الجهازان على نفس شبكة Wi-Fi.', go: 'انضمام', wait: 'جارٍ الاتصال...', live: 'تم الاتصال: اضغط A للانضمام إلى اللعبة', none: 'لا توجد لعبة بهذا الرمز. تحقق منه وحاول مجددًا.', net: 'تعذّر الوصول إلى الإنترنت.', rules: 'خدمة الغرف غير مفعّلة بعد.', config: 'إعدادات Firebase مفقودة في هذا التطبيق.', fail: 'تعذّر الاتصال. يجب أن يكون الجهازان على نفس شبكة Wi-Fi (وليس شبكة ضيوف).', lost: 'انقطع الاتصال. اطلب رمزًا جديدًا من اللعبة.', again: 'ابدأ من جديد', nonet: 'هذا المتصفح لا يستطيع الاتصال. جرّب Chrome أو Safari.' }
    };
    var lang = (navigator.language || 'en').slice(0, 2), T = TXT[lang] || TXT.en;
    var $ = function (id) { return document.getElementById(id); }, g = null, opened = false, timer = 0;
    document.documentElement.lang = lang; if (lang === 'ar') document.documentElement.dir = 'rtl';
    $('h').textContent = T.h; $('how').textContent = T.how; $('go').textContent = T.go;
    function msg(t, bad) { $('msg').textContent = t || ''; $('msg').className = bad ? 'bad' : ''; }
    function ui(on) { $('go').style.display = $('code').style.display = on ? '' : 'none'; $('how').style.display = on ? '' : 'none'; }

    function join(code) {
        if (!NetPad.supported) return msg(T.nonet, true);
        code = NetPad.room.clean(code); if (code.length !== 5) return msg(T.none, true);
        ui(false); msg(T.wait); opened = false;
        timer = setTimeout(function () { if (!opened) { if (g) g.close(); retry(T.fail); } }, 20000);       // the host answers within a second or two
        NetPad.room.join(code, { onOpen: live, onClose: lost }).then(function (c) { g = c; }, function (e) {
            clearTimeout(timer); retry(e.status === 404 ? T.none : e.status === 403 ? T.rules : e.status === -1 ? T.config : T.net);
        });
    }
    function retry(text) { ui(true); msg(text, true); }
    function live() {
        opened = true; clearTimeout(timer);
        $('info').style.display = 'none'; $('live').style.display = 'block'; $('live').textContent = T.live;
        VirtualPad.init({ force: true, pause: false, buttons: [{ label: 'A', key: 90 }, { label: 'B', key: 88 }, { label: 'C', key: 8 }],
                          send: function (k, on) { g.send([k, on ? 1 : 0]); } });
        try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
    }
    function lost() {
        if (!opened) return;                                    // never connected: join() shows its own message
        VirtualPad.hide(); $('live').style.display = 'none'; $('info').style.display = 'block'; ui(false);
        msg(T.lost, true);
        var b = document.createElement('span'); b.className = 'b'; b.textContent = T.again; b.onclick = function () { location.hash = ''; location.reload(); };
        $('msg').appendChild(document.createElement('br')); $('msg').appendChild(b);
    }
    $('go').onclick = function () { join($('code').value); };
    $('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') join($('code').value); });
    var pre = (/[?&]room=([A-Za-z0-9]+)/.exec(location.search) || /#([A-Za-z0-9]+)/.exec(location.hash) || [])[1];
    if (pre) { $('code').value = pre.toUpperCase(); join(pre); }
})();
</script>
</body>
</html>
