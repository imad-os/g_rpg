<title>Hollowmere</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080c; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }

  #stage { position: absolute; overflow: hidden; --u: 10.8px; }

           background: rgba(10,12,20,0.72); border-radius: calc(var(--u) * 1); padding: calc(var(--u) * 0.6) calc(var(--u) * 1.6); }
  #stCoins { color: #ffd23f; } #stPot { color: #ff7a9a; }

  #dtext { font-size: calc(var(--u) * 3.6); line-height: 1.35; min-height: calc(var(--u) * 9.5); unicode-bidi: plaintext; }
  #dchoices { display: flex; flex-direction: column; gap: calc(var(--u) * 0.8); margin-top: calc(var(--u) * 1.2); }
  .ch { font-size: calc(var(--u) * 3.2); padding: calc(var(--u) * 0.6) calc(var(--u) * 1.6); border: calc(var(--u) * 0.4) solid transparent; border-radius: calc(var(--u) * 1);
        background: rgba(255,255,255,0.06); color: #d8d8e0; transition: transform 0.1s; }
  .ch.sel { border-color: #ffd23f; background: rgba(255,210,63,0.22); color: #fff; font-weight: 800; transform: scale(1.03); box-shadow: 0 0 calc(var(--u) * 1.4) rgba(255,210,63,0.6); }
  .ch.sel::before { content: '▶ '; color: #ffd23f; }
  [dir="rtl"] .ch.sel::before { content: '◀ '; }
  #dmore { position: absolute; bottom: calc(var(--u) * 0.8); inset-inline-end: calc(var(--u) * 2); color: #ffd23f; font-size: calc(var(--u) * 2.6); animation: bob 0.8s infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(calc(var(--u) * 0.6)); } }

  /* full-screen overlays: title, story slides, journal */

  .mtitle { font-size: calc(var(--u) * 11); font-weight: 900; color: #ffd76a; letter-spacing: 0.04em; text-shadow: 0 calc(var(--u) * 0.6) 0 #3a2410, 0 0 calc(var(--u) * 4) rgba(255,200,90,0.5); }
  .msub { font-size: calc(var(--u) * 4); color: #e9d8a6; margin-bottom: calc(var(--u) * 4); max-width: calc(var(--u) * 110); text-shadow: 0 calc(var(--u) * 0.3) 0 #000; }
  .mi { font-size: calc(var(--u) * 4.2); font-weight: 700; margin: calc(var(--u) * 1.2) auto; padding: calc(var(--u) * 0.8) calc(var(--u) * 3); width: max-content; min-width: calc(var(--u) * 40);
        border: calc(var(--u) * 0.5) solid rgba(255,255,255,0.15); border-radius: calc(var(--u) * 1.2); background: rgba(0,0,0,0.5); color: #ccc; }
  .mi.sel { border-color: #ffd23f; color: #fff; background: rgba(255,210,63,0.25); transform: scale(1.08); box-shadow: 0 0 calc(var(--u) * 2) rgba(255,210,63,0.6); }
  .slide { position: absolute; inset: 0; background: rgba(5,6,10,0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 12%; }
  .slide.end { background: rgba(30,20,5,0.8); }
  .stext { font-size: calc(var(--u) * 4.6); line-height: 1.45; text-align: center; color: #f3ead2; white-space: pre-line; max-width: calc(var(--u) * 130); }
  .snext { margin-top: calc(var(--u) * 5); font-size: calc(var(--u) * 3); color: #ffd23f; animation: bob 0.8s infinite alternate; }
  .journal { background: rgba(14,12,20,0.95); border: calc(var(--u) * 0.5) solid #e9d8a6; border-radius: calc(var(--u) * 2); padding: calc(var(--u) * 3) calc(var(--u) * 4); width: 76%; }
  .jtitle { font-size: calc(var(--u) * 5); font-weight: 900; color: #ffd76a; }
  .jzone { font-size: calc(var(--u) * 2.8); color: #9fb0c8; margin-bottom: calc(var(--u) * 1.4); }
  .jobj { font-size: calc(var(--u) * 3.6); font-weight: 700; margin-bottom: calc(var(--u) * 1.8); }
  .jrow { font-size: calc(var(--u) * 3); margin: calc(var(--u) * 1) 0; display: flex; gap: calc(var(--u) * 3); flex-wrap: wrap; }
  .jem { color: #666a78; } .jem.on.r { color: #ff8a5a; } .jem.on.b { color: #5ab8ff; } .jem.on.s { color: #d8c49a; }
  .jpage { font-size: calc(var(--u) * 2.6); font-style: italic; color: #c8bfa8; margin: calc(var(--u) * 1.4) 0; }
  .journal .mi { margin-top: calc(var(--u) * 2); }
  /* list screens: forge, potions, equipment */
  .listbox { background: rgba(14,12,20,0.96); border: calc(var(--u) * 0.5) solid #e9d8a6; border-radius: calc(var(--u) * 2); width: 80%; max-height: 86%;
             display: flex; flex-direction: column; padding: calc(var(--u) * 2) calc(var(--u) * 3); }
  .lhead { display: flex; justify-content: space-between; align-items: baseline; gap: calc(var(--u) * 2); }
  .ltitle { font-size: calc(var(--u) * 4.6); font-weight: 900; color: #ffd76a; }
  .linfo { font-size: calc(var(--u) * 3.2); font-weight: 800; color: #ffd23f; white-space: nowrap; }
  .ltabs { font-size: calc(var(--u) * 2.8); color: #ffb38a; margin-top: calc(var(--u) * 0.6); }
  .lrows { flex: 1; min-height: 0; overflow: hidden; margin-top: calc(var(--u) * 1.4); display: flex; flex-direction: column; gap: calc(var(--u) * 0.8); position: relative; }
  .li { flex: none; display: flex; justify-content: space-between; align-items: center; gap: calc(var(--u) * 2); padding: calc(var(--u) * 0.8) calc(var(--u) * 1.6);
        border: calc(var(--u) * 0.45) solid transparent; border-radius: calc(var(--u) * 1); background: rgba(255,255,255,0.06); }
  .li.sel { border-color: #ffd23f; background: rgba(255,210,63,0.22); transform: scale(1.02); box-shadow: 0 0 calc(var(--u) * 1.6) rgba(255,210,63,0.55); }
  .li.dim .lname, .li.dim .lr { opacity: 0.5; }
  .li.mark .lr { color: #7ef0a0; }
  .limg { flex: none; } .limg canvas { width: calc(var(--u) * 8); height: calc(var(--u) * 8); display: block; }
  .ll { flex: 1; min-width: 0; }
  .lname.r1 { color: #5ab0ff; } .lname.r2 { color: #c77dff; } .lname.r3 { color: #ffb020; }
  .lname { font-size: calc(var(--u) * 3.3); font-weight: 800; }
  .lsub { font-size: calc(var(--u) * 2.5); color: #b8c0d0; }
  .lr { font-size: calc(var(--u) * 3); font-weight: 800; color: #ffd23f; white-space: nowrap; }
  .jsub { font-size: calc(var(--u) * 3); font-weight: 900; color: #7ef0a0; margin-top: calc(var(--u) * 1.4); }
  .jq { font-size: calc(var(--u) * 2.8); margin: calc(var(--u) * 0.5) 0; }
  .jq.ready { color: #7ef0a0; }
  /* equipment: boxes with pictures, and the details of the chosen one */
  .gearbox { background: rgba(14,12,20,0.97); border: calc(var(--u) * 0.5) solid #e9d8a6; border-radius: calc(var(--u) * 2); width: 90%; height: 88%;
             display: flex; flex-direction: column; padding: calc(var(--u) * 1.6) calc(var(--u) * 2.4); box-sizing: border-box; }
  .gtabs { display: flex; gap: calc(var(--u) * 1); margin-top: calc(var(--u) * 1); flex-wrap: wrap; }
  .gt { font-size: calc(var(--u) * 2.8); font-weight: 800; padding: calc(var(--u) * 0.5) calc(var(--u) * 1.6); border-radius: calc(var(--u) * 1); border: calc(var(--u) * 0.4) solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: #c8c8d0; }
  .gt.cur { background: rgba(233,216,166,0.25); color: #ffe9a8; border-color: #e9d8a6; }
  .gt.sel { border-color: #ffd23f; box-shadow: 0 0 calc(var(--u) * 1.4) rgba(255,210,63,0.6); color: #fff; }
  .gmain { flex: 1; min-height: 0; display: flex; gap: calc(var(--u) * 2); margin-top: calc(var(--u) * 1.4); }
  .ggrid { flex: 1; min-width: 0; overflow: hidden; display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: calc(var(--u) * 17.5); gap: calc(var(--u) * 1); align-content: start; padding: calc(var(--u) * 0.6); }
  .gi { position: relative; display: flex; flex-direction: column; align-items: center; border: calc(var(--u) * 0.45) solid #444a5a; border-radius: calc(var(--u) * 1.2);
        background: linear-gradient(#262a38, #161822); padding: calc(var(--u) * 0.4); box-sizing: border-box; overflow: hidden; }
  .gi.r1 { border-color: #3a7ad0; background: linear-gradient(#1d2c48, #141a28); } .gi.r2 { border-color: #8a4ad0; background: linear-gradient(#2c1d48, #1a1428); } .gi.r3 { border-color: #d08a10; background: linear-gradient(#402c10, #22180a); }
  .gi.sel { border-color: #ffd23f; transform: scale(1.06); box-shadow: 0 0 calc(var(--u) * 1.8) rgba(255,210,63,0.75); z-index: 1; }
  .gi.worn::after { content: '✓'; position: absolute; bottom: calc(var(--u) * 0.2); inset-inline-end: calc(var(--u) * 0.7); color: #7ef0a0; font-weight: 900; font-size: calc(var(--u) * 2.6); }
  .gn { font-size: calc(var(--u) * 2.2); font-weight: 800; text-align: center; line-height: 1.1; height: calc(var(--u) * 4.9); overflow: hidden; width: 100%; display: flex; align-items: center; justify-content: center; }
  .gn.r1 { color: #5ab0ff; } .gn.r2 { color: #c77dff; } .gn.r3 { color: #ffb020; }
  .gi canvas { width: calc(var(--u) * 11); height: calc(var(--u) * 11); image-rendering: pixelated; }
  .gup { position: absolute; bottom: calc(var(--u) * 0.3); inset-inline-start: calc(var(--u) * 0.6); font-size: calc(var(--u) * 2.2); font-weight: 900; color: #ffd23f; }
  .gi.empty { border-style: dashed; color: #8a90a0; justify-content: center; font-size: calc(var(--u) * 2.6); font-weight: 800; }
  .gdet { width: 34%; flex: none; background: rgba(255,255,255,0.05); border-radius: calc(var(--u) * 1.4); padding: calc(var(--u) * 1.6); box-sizing: border-box; overflow: hidden; }
  .gdn { font-size: calc(var(--u) * 3.4); font-weight: 900; } .gdn.r1 { color: #5ab0ff; } .gdn.r2 { color: #c77dff; } .gdn.r3 { color: #ffb020; }
  .gdk { font-size: calc(var(--u) * 2.4); color: #9fb0c8; margin-bottom: calc(var(--u) * 1); }
  .gdet canvas { width: calc(var(--u) * 15); height: calc(var(--u) * 15); image-rendering: pixelated; display: block; margin: calc(var(--u) * 0.6) auto; }
  .gds { font-size: calc(var(--u) * 2.6); margin: calc(var(--u) * 0.4) 0; display: flex; justify-content: space-between; gap: calc(var(--u) * 1); }
  .gds .up { color: #7ef0a0; } .gds .dn { color: #ff7a7a; }

<div id="stage">

  <div id="hud" style="display:none">

      <div class="pbar" id="pb1" style="display:none"><div class="pn" id="pn1"></div><div class="bar"><i id="hp1"></i></div><div class="bar sbar"><i id="sp1"></i></div>
        <div class="abil"><span class="ab" id="ab1h">✚<b></b><u></u></span><span class="ab" id="ab1p">✸<b></b><u></u></span><span class="ab" id="ab1d">➶<b></b><u></u></span></div></div>
    </div>
    <div id="join" style="display:none"></div>
    <div id="hint"></div>
    <div id="bossBox" style="display:none"><div id="bossName"></div><div class="bar"><i id="bossFill"></i></div></div>
    <div id="banner"></div>
