<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Hollowmere 3: The Veilscar Frontier. The Veilscar tears the night sky open over Dawnwatch's towers, and the
       Hollow King's crown burns in its light; a gold frame with a ring and four points, like an ability icon. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.25" stop-color="#d8a640"/>
      <stop offset="0.5" stop-color="#8a5a1c"/>
      <stop offset="0.72" stop-color="#e8bc58"/>
      <stop offset="1" stop-color="#6a4216"/>
    </linearGradient>
    <linearGradient id="gold2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c4"/>
      <stop offset="0.4" stop-color="#c8902e"/>
      <stop offset="1" stop-color="#5a3812"/>
    </linearGradient>
    <radialGradient id="sky" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#4a2a8a"/>
      <stop offset="0.5" stop-color="#22144a"/>
      <stop offset="1" stop-color="#0a0820"/>
    </radialGradient>
    <radialGradient id="riftGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#e2b8ff" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#9a4aff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5a1ac0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6fbff"/>
      <stop offset="0.5" stop-color="#9ad8ff"/>
      <stop offset="1" stop-color="#3a6ad0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="disc"><circle cx="128" cy="128" r="88"/></clipPath>
  </defs>

  <!-- the square frame -->
  <rect width="256" height="256" fill="#000"/>
  <rect x="6" y="6" width="244" height="244" rx="10" fill="url(#gold)"/>
  <rect x="16" y="16" width="224" height="224" rx="6" fill="#120c22"/>
  <rect x="16" y="16" width="224" height="224" rx="6" fill="none" stroke="#3a2610" stroke-width="2"/>
  <g fill="#2a2234" stroke="#5a4a66" stroke-width="1.5">
    <path d="M18 18 L58 18 L18 58 Z"/><path d="M238 18 L198 18 L238 58 Z"/><path d="M18 238 L58 238 L18 198 Z"/><path d="M238 238 L198 238 L238 198 Z"/>
  </g>

  <!-- the night sky in the ring -->
  <circle cx="128" cy="128" r="88" fill="url(#sky)"/>
  <g clip-path="url(#disc)">
    <!-- clouds -->
    <g fill="#3a2a72" opacity="0.7">
      <ellipse cx="70" cy="150" rx="46" ry="16"/><ellipse cx="190" cy="160" rx="50" ry="18"/><ellipse cx="128" cy="190" rx="70" ry="20"/>
    </g>
    <g fill="#5a3aa0" opacity="0.35"><ellipse cx="96" cy="88" rx="40" ry="10"/><ellipse cx="170" cy="100" rx="36" ry="9"/></g>
    <!-- stars -->
    <g fill="#ffffff"><circle cx="70" cy="76" r="1.3"/><circle cx="186" cy="70" r="1.1"/><circle cx="58" cy="118" r="1"/><circle cx="200" cy="122" r="1.2"/><circle cx="150" cy="58" r="1"/></g>

    <!-- the Veilscar: a tear of light across the sky -->
    <ellipse cx="128" cy="112" rx="70" ry="48" fill="url(#riftGlow)" filter="url(#soft)"/>
    <path d="M60 156 L86 132 L80 124 L108 108 L102 98 L132 86 L128 76 L162 66 L156 80 L190 72 L162 92 L168 100 L138 112 L144 122 L112 138 L118 146 Z"
          fill="#c88aff" opacity="0.75" filter="url(#soft2)"/>
    <path d="M66 152 L90 132 L84 125 L110 110 L105 101 L133 89 L130 80 L160 70 L156 82 L182 76 L160 92 L165 99 L137 110 L142 119 L114 134 L119 141 Z" fill="#f4e4ff"/>
    <path d="M82 140 L100 126 L96 120 L118 108 L114 102 L138 92 L136 86 L156 79" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- cracks running from the tear -->
    <g fill="none" stroke="#d8a8ff" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
      <path d="M108 108 L96 96 L98 88"/><path d="M160 70 L172 56 L170 48"/><path d="M137 110 L150 124 L148 132"/><path d="M90 132 L76 140 L70 150"/><path d="M182 76 L196 80"/>
    </g>
    <g fill="#ffffff"><circle cx="98" cy="88" r="1.8"/><circle cx="172" cy="56" r="1.6"/><circle cx="150" cy="128" r="1.5"/><circle cx="196" cy="80" r="1.4"/></g>

    <!-- the Hollow King's crown, burning in the rift's light -->
    <g transform="translate(128 124) scale(1.35)">
      <ellipse cx="0" cy="2" rx="34" ry="22" fill="#7ad8ff" opacity="0.45" filter="url(#soft)"/>
      <path d="M-24 10 L-26 -12 L-14 -2 L-8 -20 L0 -6 L8 -20 L14 -2 L26 -12 L24 10 Z" fill="url(#crown)" stroke="#1e2a6a" stroke-width="2" stroke-linejoin="round"/>
      <rect x="-25" y="8" width="50" height="7" rx="2" fill="#3a6ad0" stroke="#1e2a6a" stroke-width="2"/>
      <circle cx="0" cy="11.5" r="3" fill="#f4e4ff"/><circle cx="-14" cy="11.5" r="2" fill="#b07aff"/><circle cx="14" cy="11.5" r="2" fill="#b07aff"/>
      <g fill="#ffffff"><circle cx="-26" cy="-13" r="2.4"/><circle cx="-8" cy="-21" r="2.4"/><circle cx="8" cy="-21" r="2.4"/><circle cx="26" cy="-13" r="2.4"/></g>
      <!-- spectral flames rising from the crown -->
      <path d="M-8 -22 Q-12 -34 -4 -44 Q-6 -34 0 -28 Q2 -38 8 -46 Q6 -34 10 -24" fill="#bff4ff" opacity="0.7"/>
    </g>

    <!-- Dawnwatch: two frontier towers with lit windows and its walls (no mountains) -->
    <g fill="#0c0a1a">
      <path d="M44 216 L44 150 L40 150 L40 140 L46 140 L46 134 L52 134 L52 140 L58 140 L58 134 L64 134 L64 140 L70 140 L70 150 L66 150 L66 216 Z"/>
      <path d="M52 134 L58 118 L64 134 Z"/>
      <path d="M186 216 L186 158 L182 158 L182 148 L188 148 L188 142 L194 142 L194 148 L200 148 L200 142 L206 142 L206 148 L212 148 L212 158 L208 158 L208 216 Z"/>
      <path d="M194 142 L200 126 L206 142 Z"/>
      <path d="M66 216 L66 176 L72 176 L72 170 L78 170 L78 176 L90 176 L90 170 L96 170 L96 176 L108 176 L108 216 Z"/>
      <path d="M148 216 L148 180 L156 180 L156 174 L162 174 L162 180 L176 180 L176 174 L182 174 L182 180 L186 180 L186 216 Z"/>
    </g>
    <g fill="#ffc860">
      <rect x="53" y="158" width="4" height="6" rx="1"/><rect x="53" y="176" width="4" height="6" rx="1"/>
      <rect x="195" y="166" width="4" height="6" rx="1"/><rect x="195" y="184" width="4" height="6" rx="1"/>
      <rect x="84" y="188" width="3" height="5" rx="1"/><rect x="166" y="192" width="3" height="5" rx="1"/>
    </g>
    <g fill="#ffb040" opacity="0.5" filter="url(#soft2)"><circle cx="55" cy="160" r="5"/><circle cx="197" cy="168" r="5"/></g>
  </g>

  <!-- the gold ring and its four points -->
  <circle cx="128" cy="128" r="90" fill="none" stroke="#2a1a08" stroke-width="12"/>
  <circle cx="128" cy="128" r="90" fill="none" stroke="url(#gold2)" stroke-width="8"/>
  <circle cx="128" cy="128" r="85" fill="none" stroke="#fff0b0" stroke-width="1" opacity="0.5"/>
  <g fill="url(#gold)" stroke="#3a2408" stroke-width="2" stroke-linejoin="round">
    <path d="M128 4 L142 34 L128 48 L114 34 Z"/>
    <path d="M128 252 L142 222 L128 208 L114 222 Z"/>
    <path d="M4 128 L34 114 L48 128 L34 142 Z"/>
    <path d="M252 128 L222 114 L208 128 L222 142 Z"/>
  </g>
  <g fill="#fff4c4" opacity="0.7">
    <path d="M128 10 L136 32 L128 40 Z"/><path d="M128 214 L136 222 L128 246 Z"/><path d="M10 128 L32 120 L40 128 Z"/><path d="M216 128 L224 120 L246 128 Z"/>
  </g>
</svg>
